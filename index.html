<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Class Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f5;--surf:#fff;--ink:#14213d;--mut:#5b6678;--line:#d5dce4;--acc:#f2a900;--ok:#0f766e;--okbg:#d9f1ee;--bad:#b42318;--badbg:#fde4e1;--warn:#8a5a00;--warnbg:#fff1cc;--navy:#14213d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1522;--surf:#172033;--ink:#e8edf5;--mut:#9aa6ba;--line:#2b3750;--ok:#5eead4;--okbg:#10353a;--bad:#ff9a8f;--badbg:#3d1c1c;--warn:#ffd36b;--warnbg:#3b2f10;--navy:#0a101b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1522;--surf:#172033;--ink:#e8edf5;--mut:#9aa6ba;--line:#2b3750;--ok:#5eead4;--okbg:#10353a;--bad:#ff9a8f;--badbg:#3d1c1c;--warn:#ffd36b;--warnbg:#3b2f10;--navy:#0a101b}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.15}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--onnav,#fff);display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
header h1{font-size:20px;flex:1;min-width:120px}
#menu{border:0;background:var(--ovl,rgba(255,255,255,.14));color:var(--onnav,#fff);width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
.role{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.role button{border:0;background:none;color:inherit;padding:6px 12px;border-radius:999px;font:500 13px inherit;cursor:pointer}
.role button[aria-pressed=true]{background:var(--acc);color:#14213d}
.app{display:flex;align-items:flex-start}
aside{width:250px;flex:none;position:sticky;top:60px;height:calc(100vh - 60px);overflow:hidden;background:var(--surf);border-right:1px solid var(--line);transition:width .25s,transform .25s}
aside .in{width:250px;padding:12px;display:flex;flex-direction:column;gap:2px}
.collapsed aside{width:0;border:0}
aside button{display:flex;gap:10px;align-items:center;border:0;background:none;color:var(--ink);padding:11px 12px;border-radius:10px;font:500 15px inherit;cursor:pointer;text-align:left;width:100%}
aside button:hover{background:var(--bg)}
aside button[aria-current=page]{background:var(--navy);color:var(--onnav,#fff)}
aside .who{padding:8px 12px 12px;color:var(--mut);font-size:13px}
main{flex:1;min-width:0;max-width:940px;padding:18px;margin:0 auto}
@media(max-width:900px){aside{position:fixed;left:0;top:60px;z-index:15;transform:translateX(0);box-shadow:4px 0 18px rgba(0,0,0,.25)}
.collapsed aside{width:250px;transform:translateX(-105%);box-shadow:none}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 12px;gap:8px;flex-wrap:wrap}
.sec h2{font-size:22px}.mut{color:var(--mut);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:12px}
.cards .panel{margin:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.cards .panel:hover{border-color:var(--ink)}
.big{font:700 30px "Bricolage Grotesque",sans-serif}
.cls{display:grid;grid-template-columns:74px 1fr;gap:12px;border-left:4px solid var(--line)}
.cls.held{border-left-color:var(--ok)}.cls.cancelled{border-left-color:var(--bad)}.cls.moved{border-left-color:var(--acc)}
.time{font:700 16px "Bricolage Grotesque",sans-serif}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--line);color:var(--ink)}
.tag.held,.tag.done,.tag.resolved,.tag.ready{background:var(--okbg);color:var(--ok)}
.tag.cancelled,.tag.open{background:var(--badbg);color:var(--bad)}
.tag.moved,.tag.soon,.tag.pending{background:var(--warnbg);color:var(--warn)}
.b{border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:6px 12px;border-radius:8px;font:500 13px inherit;cursor:pointer}
.b:hover{border-color:var(--ink)}.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc,#14213d);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:10px}
input,select,textarea{width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:400 15px inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}.cls{grid-template-columns:1fr;gap:4px}}
.stu{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surf);color:var(--mut);padding:6px 11px;font:700 13px inherit;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border:0}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--onnav,#fff)}
.seg .P[aria-pressed=true]{background:var(--okbg);color:var(--ok)}.seg .L[aria-pressed=true]{background:var(--warnbg);color:var(--warn)}.seg .A[aria-pressed=true]{background:var(--badbg);color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:24px}
.price{font:700 18px "Bricolage Grotesque",sans-serif}
.date{width:58px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;flex:none}.date b{display:block;font:700 20px "Bricolage Grotesque",sans-serif}.date span{font-size:12px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--onnav,#fff);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#toast.on{opacity:1}
.segw{position:relative;display:inline-block;max-width:100%;margin-bottom:14px;vertical-align:top}
.nx{position:absolute;right:2px;top:50%;margin-top:-20px;width:40px;height:40px;border:0;border-radius:50%;color:#fff;font-size:26px;font-weight:700;line-height:38px;padding:0;cursor:pointer;display:none;box-shadow:0 2px 8px rgba(0,0,0,.35);background:#e91e63;animation:dance 1.1s ease-in-out infinite,hues 3s linear infinite}
.nx.on{display:block}
@keyframes dance{0%,100%{transform:translateX(0) rotate(0) scale(1)}15%{transform:translateX(-6px) rotate(-14deg) scale(1.1)}30%{transform:translateX(0) rotate(0) scale(.95)}45%{transform:translateX(6px) rotate(14deg) scale(1.1)}60%{transform:translateY(-6px) rotate(0) scale(1.15)}80%{transform:translateY(0) rotate(0) scale(1)}}
@keyframes hues{0%{background:#e91e63}20%{background:#ff9800}40%{background:#4caf50}60%{background:#03a9f4}80%{background:#9c27b0}100%{background:#e91e63}}
@media (prefers-reduced-motion:reduce){.nx{animation:none}}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:18px}#gate[hidden]{display:none}
#gate .panel{width:100%;max-width:400px;padding:22px}
#gate{align-items:flex-start;overflow-y:auto}#gate .panel{margin:20px auto}
.seg button{white-space:nowrap}
.panel{border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05)}
.cards .panel{border-top:3px solid var(--acc);background:linear-gradient(180deg,var(--surf),var(--tint,var(--surf)))}
.big{color:var(--prim,var(--ink))}.sec h2,h3{color:var(--prim,var(--ink))}
.hero{background:linear-gradient(110deg,var(--navy),var(--navy2,var(--navy)));color:var(--onnav,#fff);border-radius:16px;padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.hero h2{font-size:28px;color:inherit}.hero .mut{color:inherit;opacity:.8}
#thpanel{position:fixed;right:10px;top:calc(var(--hh,60px) + 8px);z-index:60;width:min(92vw,340px);max-height:80vh;overflow:auto;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.swg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.sw{display:flex;align-items:center;gap:8px;text-align:left}.sw span{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none}.sw[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
input[type=color]{padding:2px;height:42px}
#bk{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:14}
aside{top:var(--hh,60px);height:calc(100vh - var(--hh,60px));height:calc(100dvh - var(--hh,60px))}
input,select,textarea{font-size:16px}
@media (min-width:1200px){main{max-width:1180px;padding:24px 32px}.cards{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}aside,aside .in{width:270px}.collapsed aside{width:0}}
@media (min-width:901px) and (max-width:1199px){main{max-width:none;padding:18px 24px}aside,aside .in{width:230px}.collapsed aside{width:0}}
@media (max-width:900px){aside{top:var(--hh,60px)}main{padding:14px}}
@media (max-width:560px){.cards{grid-template-columns:repeat(2,1fr);gap:10px}.big{font-size:24px}.sec h2{font-size:19px}header h1{font-size:17px}header{padding:8px 10px;gap:8px}.panel{padding:12px}.row{gap:8px}}
@media (max-width:360px){.cards{grid-template-columns:1fr}}
@media (pointer:coarse){.b{min-height:40px}aside button{min-height:46px}.seg button{min-height:40px}.cell{min-height:34px;min-width:34px}}
@media (orientation:landscape) and (max-height:480px){header{padding:4px 10px}aside .in{padding:6px}}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px #f2c200,0 0 6px 1px rgba(255,200,0,.5)}50%{box-shadow:0 0 0 2px #ffd54a,0 0 18px 5px rgba(255,200,0,.9)}}
.glow{border-color:#f2c200!important;animation:glow 1.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
#view.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.05s}#view.enter>*:nth-child(3){animation-delay:.1s}#view.enter>*:nth-child(4){animation-delay:.15s}#view.enter>*:nth-child(5){animation-delay:.2s}#view.enter>*:nth-child(6){animation-delay:.25s}#view.enter>*:nth-child(7){animation-delay:.3s}#view.enter>*:nth-child(8){animation-delay:.35s}#view.enter>*:nth-child(9){animation-delay:.4s}#view.enter>*:nth-child(n+10){animation-delay:.45s}
.cards .panel{transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.cards .panel:hover{transform:translateY(-5px) rotate(-.5deg);box-shadow:0 12px 24px rgba(0,0,0,.2)}
.cards .panel:active{transform:scale(.96)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.cards .big{display:inline-block;animation:bob 3.2s ease-in-out infinite}
.cards .panel:nth-child(2n) .big{animation-duration:2.6s;animation-delay:-.7s}.cards .panel:nth-child(3n) .big{animation-duration:3.8s;animation-delay:-1.4s}
.b{transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s}.b:hover{transform:translateY(-2px)}.b:active{transform:scale(.94)}
header{background:linear-gradient(100deg,var(--navy),var(--navy2,#22407a),var(--navy));background-size:220% 100%;animation:hdr 14s ease-in-out infinite}
@keyframes hdr{0%,100%{background-position:0 0}50%{background-position:100% 0}}
.av{animation:bob 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.glow{box-shadow:0 0 0 2px #f2c200,0 0 14px 4px rgba(255,200,0,.75)!important}}
aside{transition:width .35s cubic-bezier(.4,0,.2,1),transform .35s cubic-bezier(.4,0,.2,1),box-shadow .35s}
aside .in{transition:opacity .3s ease .05s}.collapsed aside .in{opacity:0}
aside button{position:relative;transition:background .25s,color .25s,transform .2s,box-shadow .25s}
aside button span{display:inline-block;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
aside button:hover{transform:translateX(4px)}aside button:hover span{transform:scale(1.25) rotate(-6deg)}
aside button:active{transform:scale(.97)}
aside button[aria-current=page]{box-shadow:inset 4px 0 0 var(--acc)}
aside button[aria-current=page] span{transform:scale(1.15)}
@keyframes navin{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
.opening aside .in>*{animation:navin .4s cubic-bezier(.2,.8,.2,1) both}
.opening aside .in>*:nth-child(1){animation-delay:.02s}.opening aside .in>*:nth-child(2){animation-delay:.06s}.opening aside .in>*:nth-child(3){animation-delay:.1s}.opening aside .in>*:nth-child(4){animation-delay:.14s}.opening aside .in>*:nth-child(5){animation-delay:.18s}.opening aside .in>*:nth-child(6){animation-delay:.22s}.opening aside .in>*:nth-child(7){animation-delay:.26s}.opening aside .in>*:nth-child(8){animation-delay:.3s}.opening aside .in>*:nth-child(9){animation-delay:.34s}.opening aside .in>*:nth-child(10){animation-delay:.38s}.opening aside .in>*:nth-child(11){animation-delay:.42s}.opening aside .in>*:nth-child(12){animation-delay:.46s}
#menu{transition:transform .25s,background .25s}#menu:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){aside,aside *{transition:none!important;animation:none!important}}
.reg{border-collapse:collapse;font-size:13px;min-width:860px;width:100%}.reg th,.reg td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}.reg th{background:var(--bg)}.reg td:nth-child(2){text-align:left;position:sticky;left:0;background:var(--surf)}
.cell{min-width:30px;padding:3px 4px;margin:0}.cell.P{background:var(--okbg);color:var(--ok);font-weight:700}.cell.L{background:var(--warnbg);color:var(--warn);font-weight:700}.cell.A{background:var(--badbg);color:var(--bad);font-weight:700}
@media print{header,aside,#toast,.b:not(.cell),nav{display:none!important}main{max-width:none;padding:0}body.pr-rc #view>:not(#rcpt){display:none!important}}
.badge{margin-left:auto;background:var(--acc);color:var(--onacc,#14213d);border-radius:999px;min-width:22px;height:22px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;font:700 12px "DM Sans",sans-serif}
.env{position:relative;padding:6px 10px}.dot{position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:#f2a900;border:2px solid var(--navy)}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 13px "Bricolage Grotesque",sans-serif}
</style>
</head>
<body>
<header>
 <button id="menu" aria-label="Show or hide navigation" aria-expanded="true">☰</button>
 <h1>Class Portal</h1>
 <button id="thm" class="b env" aria-label="Choose colours" title="Colours">🎨</button><div class="row" id="acct"></div>
</header>
<div class="app" id="app">
 <aside id="side" aria-label="Main navigation"><div class="in" id="nav"></div></aside>
 <main id="view"></main>
</div>
<div id="gate" hidden><div class="panel"><h2 style="font-size:26px;margin-bottom:10px">Class Portal</h2><div class="seg" id="gtabs" style="margin-bottom:14px;display:flex;overflow-x:auto"><button data-g="in">Sign in</button><button data-g="new">Create account</button><button data-g="rep">Admin</button></div>
<div id="gnote" class="mut" style="margin-bottom:10px;color:var(--ok)"></div><form id="fLogin" data-pane="in"><label>Email<input name="em" type="email" required autocomplete="email"></label><label>Password<input name="pass" type="password" required autocomplete="current-password"></label><button class="b pri" style="width:100%;padding:10px">Sign in</button><div class="row" style="margin-top:10px"><button type="button" class="b" data-g="forgot">Forgot password?</button></div></form>
<form id="fNew" data-pane="new" hidden><label>Full name<input name="name" required maxlength="40" autocomplete="name"></label><label>Registration number (staff: staff number)<input name="reg" required maxlength="25" autocapitalize="characters"></label><label>Institution<input name="inst" list="insts" required maxlength="60" value="JKUAT NCBD Campus"><datalist id="insts"><option value="JKUAT NCBD Campus"></datalist></label><label>Course (lecturers: choose the course you teach)<select name="prog" required><option value="">Select your course</option></select></label><label>I am a<select name="role"><option value="stu">Student</option><option value="lec">Lecturer</option><option value="rep">Class rep</option></select></label><label>Email<input name="em" type="email" required autocomplete="email"></label><label>Password (at least 8 characters)<input name="pass" type="password" required minlength="8" autocomplete="new-password"></label><label>Confirm password<input name="pass2" type="password" required minlength="8" autocomplete="new-password"></label><button class="b pri" style="width:100%;padding:10px">Create account</button></form>
<form id="fForgot" data-pane="forgot" hidden><p class="mut" style="margin:0 0 10px">Enter your account email. Your class rep gets the request, creates a reset code and sends it to your email or WhatsApp.</p><label>Email<input name="em" type="email" required></label><button class="b pri" style="width:100%;padding:10px">Ask for a reset code</button><div class="row" style="margin-top:10px"><button type="button" class="b" data-g="reset">I have a code</button><button type="button" class="b" data-g="in">Back</button></div></form>
<form id="fReset" data-pane="reset" hidden><label>Email<input name="em" type="email" required></label><label>Reset code<input name="code" required inputmode="numeric" maxlength="6"></label><label>New password (at least 8 characters)<input name="pass" type="password" required minlength="8" autocomplete="new-password"></label><button class="b pri" style="width:100%;padding:10px">Set new password</button><div class="row" style="margin-top:10px"><button type="button" class="b" data-g="in">Back</button></div></form>
<form id="fRep" data-pane="rep" hidden><label>Class rep username<input name="ruser" autocomplete="username" autocapitalize="none" required></label><label>Class rep password<input name="rpass" type="password" required autocomplete="current-password"></label><label>Your name (optional)<input name="name" maxlength="40"></label><label>Course<select name="prog" required><option value="">Select your course</option></select></label><button class="b pri" style="width:100%;padding:10px">Sign in as admin</button></form>
<p class="mut" style="margin:12px 0 0">Accounts and passwords are kept in the portal's own storage, not verified by a mail server.</p></div></div>
<div id="bk" hidden></div>
<div id="thpanel" hidden></div>
<div id="toast" role="status"></div>
<script>
const KEY="cp-v2";
const NAV=[["dash","Dashboard","🏠"],["work","My class workspace","📚"],["reg","Class register","📋"],["classmates","My classmates","👥"],["time","Timetable","⏰"],["board","Classroom board","📌"],["mail","Emails","✉️"],["contacts","Contacts","☎️"],["reps","Class reps","🧑‍💼"],["cal","Academic calendar","🗓️"],["market","Marketplace","🛒"],["print","Services","🖨️"],["data","Data bundles","📶"]];
const ROLE={stu:"Student",rep:"Class rep",lec:"Lecturer"};
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const names=["Achieng Otieno","Brian Kamau","Cynthia Wanjiru","David Mutua","Esther Njeri","Faith Chebet","George Omondi","Hellen Akinyi","Ian Kiprop","Joy Mwende","Kevin Ochieng","Lucy Wambui","Mercy Atieno","Nelson Kariuki","Olivia Naliaka"];
const BUNDLES=[["Safaricom","1 GB, 1 hour",19],["Safaricom","1.5 GB, 3 hours",50],["Safaricom","1 GB, 24 hours",99],["Safaricom","2.5 GB, 7 days",300],["Airtel","1 GB, 1 hour",19],["Airtel","3 GB, 3 days",100],["Airtel","10 GB, 7 days",300],["Telkom","1 GB, 24 hours",50],["Telkom","5 GB, 7 days",250]];
const RATES={bw:["Black & white printing",5,0],col:["Colour printing",20,0],sp:["Spiral binding with B&W printing",5,150],hc:["Hardcover binding (project or thesis)",5,900],ty:["Typing (per page typed)",40,0],tp:["Typing and B&W printing",45,0],cp:["Photocopying",3,0],sc:["Scanning to PDF",10,0],lm:["Lamination",50,0,"items"],ph:["Passport photos (set of 6)",150,0,"sets"],pr:["Presentation slides design",80,0,"slides"],po:["Poster design",500,0,"posters"],cv:["CV or cover letter typing",300,0,"documents"],fmt:["Document formatting and layout",20,0],ed:["Proofreading and editing",30,0]};

 else if(a==="save-s"){const s=S.stu.find(by),g=k=>document.getElementById(k+id).value.trim(),em=g("ee");if(em&&!/^\S+@\S+\.\S+$/.test(em)){toast("Enter a valid email address");return}s.n=g("en")||s.n;s.reg=g("er").toUpperCase();s.em=em;s.ph=g("ep");S.editS=null;toast("Student updated")}
 else if(a==="del-st")S.stu=S.stu.filter(x=>!by(x));
 else if(a==="save-my"){const v=document.getElementById("myem").value.trim();if(!/^\S+@\S+\.\S+$/.test(v)){toast("Enter a valid email address");return}const tn=document.getElementById("mytn").value,n=tn||S.user.name,ex=S.lem.find(y=>lm(y.n,n))||{id:n.replace(/\W+/g,"_"),n,em:""};ex.em=v;S.user.tn=tn;put("lem",ex);toast("Email saved");render();return}
 else if(a==="del-r"){rm("roster",id);return}
 else if(a==="copy-roster"){copy(JSON.stringify(S.roster.map(x=>({n:x.n,reg:x.reg,prog:x.prog,rep:!!x.rep}))));return}
 else if(a==="alerts-read"){S.sa=[...new Set([...S.sa,...myAlerts().map(a=>String(a.id))])]}
 else if(a==="alllec")S.allLec=!S.allLec;
 else if(a==="edit-l")S.editL=b.dataset.n;
 else if(a==="cancel-l")S.editL=null;
 else if(a==="save-l"){const n=b.dataset.n,v=document.getElementById("lemi").value.trim();if(v&&!/^\S+@\S+\.\S+$/.test(v)){toast("Enter a valid email address");return}const ex=S.lem.find(y=>lm(y.n,n))||{id:n.replace(/\W+/g,"_"),n,em:""};ex.em=v;S.editL=null;put("lem",ex);toast("Email saved");render();return}
 else if(a==="grade"){const r=S.subs.find(by),v=document.getElementById("sc"+id).value;r.score=v===""?null:Math.min(100,Math.max(0,+v));r.fb=document.getElementById("fb"+id).value;put("subs",r);toast("Grade saved");return}
 S.classes.forEach(c=>{S.cst[c.id]={st:c.st,note:c.note,venue:c.venue}});
 render();
});
document.addEventListener("change",e=>{if(e.target.id==="sel"){S.sel=e.target.value;render()}});
document.addEventListener("input",e=>{if(e.target.id==="q")$("#clist").innerHTML=clist(e.target.value.toLowerCase())});
document.addEventListener("submit",e=>{
 e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),id=Date.now(),i=e.target.id;
 if(["fLogin","fNew","fForgot","fReset","fRep"].includes(i)){auth(i,f,e.target);return}
 if(i==="fDoc"){analyse({...f,mode:(e.submitter&&e.submitter.value)||"asis"});return}
 if(i==="fRs"){addRs(f);return}
 if(i==="fFold"){const n=(f.name||"").trim();if(n&&!S.fold.list.some(x=>x.name.toLowerCase()===n.toLowerCase())){const id="f"+Date.now();S.fold.list.push({id,name:n});S.fsel="my:"+id;toast("Folder created")}render();return}
 if(i==="fRates"){const v={};Object.keys(RATES).forEach(k=>{v[k]=[+f["p_"+k]||0,+f["f_"+k]||0];RATES[k][1]=v[k][0];RATES[k][2]=v[k][1]});put("rates",{id:"r",v,pay:(f.pay||"").trim()});toast("Prices saved");render();return}
 if(i==="fSend"){sendWork(f);return}
 if(i==="fMat"){addMat(f);return}
 if(i==="fMail"){addMail(f);return}
 if(i==="fStu"||i==="fBulk"){addStu(i,f);return}
 if(i==="fRoster"){addRoster(f);return}
 if(i==="fAlert"){putAlert({title:f.title,body:f.body,aud:f.aud,urgent:f.urgent==="1"}).then(()=>{toast("Notification sent");render()});return}
 if(i==="fNotice")S.notices.unshift({id,title:f.title,body:f.body,aud:f.aud,by:who(),at:"Just now"});
 if(i==="fIssue")S.issues.unshift({id,cat:f.cat,cls:f.cls,txt:f.txt,st:"open",by:who()});
 if(i==="fTask")S.tasks.push({id,title:f.title,unit:f.unit,due:f.due,done:false});
 if(i==="fCal")S.cal.push({id,date:f.date,title:f.title,type:f.type});
 if(i==="fMarket")S.market.unshift({id,title:f.title,cat:f.cat,price:+f.price,by:who(),ph:f.ph,sold:false});
 if(i==="fPrint"){addPrint(f,id);return}
 if(i==="fData"){const b=BUNDLES[f.b];S.reqs.unshift({id,net:b[0],desc:b[1],price:b[2],ph:f.ph,by:who(),st:"pending"})}
 if(i==="fSign"){const rg=f.reg.trim().toUpperCase();if(!/^[A-Z0-9][A-Z0-9\/.\-]{3,24}$/.test(rg)){toast("Enter a valid registration number");return}const ck=checkLogin(f.name.trim(),rg,f.role,f);if(ck.err){toast(ck.err);return}if(ck.e&&ck.e.prog!=null&&ck.e.prog!=="")f.prog=String(ck.e.prog);if(!f.prog){toast("Select your course");return}S.user={name:f.name.trim(),reg:rg,role:f.role,inst:(f.inst||"").trim(),auth:f.role==="rep"?1:0};S.role=f.role;if(f.prog)S.prog=f.prog;S.view="dash";e.target.reset()}
 if(i==="fStudy")S.study.push({id,o:S.user.reg,topic:f.topic,d:f.day,s:f.s,e:f.e,st:"planned"});
 if(i==="fTT"){const l=f.link.trim();if(l&&!/^https?:\/\//i.test(l)){toast("Link must start with https://");return}S.tt.link=l;S.tt.by=who()}
 toast(i==="fSign"?"Signed in":"Saved");render();
});
document.addEventListener("change",e=>{if(e.target.id!=="ttfile")return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.tt.img=c.toDataURL("image/jpeg",.75);S.tt.by=who();render();toast("Timetable uploaded")};im.onerror=()=>toast("Use a JPG or PNG image");im.src=r.result};r.readAsDataURL(f)});
render();
 .sidebar {
  height: calc(100vh - 60px); /* Adjust 60px to match your top header height */
  overflow-y: auto;
}
